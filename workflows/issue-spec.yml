name: Issue Auto-Spec

# Manual or label-driven planning. Chains implement when auto-ready applies —
# bot-added labels do not trigger other workflows.

on:
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  generate-spec:
    # Auto-triage chains planning itself; skip bot-applied labels to avoid double runs.
    if: github.event.label.name == 'needs-spec' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      dispatch_implement: ${{ steps.spec.outputs.dispatch_implement }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OpenAI secret
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Generate spec and auto-queue
        id: spec
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          AGENT_AUTO_READY_ENABLED: ${{ vars.AGENT_AUTO_READY_ENABLED }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate-issue-spec.sh
          RESULT=$(scripts/generate-issue-spec.sh | tail -1)
          if [ "$RESULT" = "dispatch_implement=true" ]; then
            echo "dispatch_implement=true" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch_implement=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch-implement:
    needs: generate-spec
    if: needs.generate-spec.outputs.dispatch_implement == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Route implement (Cursor or local-first control plane)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
        run: |
          chmod +x scripts/run-issue-implement.sh
          scripts/run-issue-implement.sh
