name: Issue Implement

# Manual ready path (agent-manual or AGENT_AUTO_READY_ENABLED=false).
# Auto-triage and issue-spec chain implement themselves when auto-ready applies.

on:
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  dispatch-cursor-agent:
    # Auto-triage / issue-spec chain implement themselves when they apply ready.
    if: github.event.label.name == 'ready' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dispatch Cursor cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/run-issue-implement.sh
          scripts/run-issue-implement.sh

      - name: Recover issue labels on dispatch failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label agent-working \
            --add-label agent-failed \
            --add-label ready 2>/dev/null || true
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Cursor cloud agent dispatch failed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and re-add \`ready\` after fixing."
