project:
  name: "My App"
  defaultBranch: main
agent:
  model: composer-2.5
  startingRef: main
commands:
  build: "npm run build"
  test: "npm run test:e2e"
labels:
  needsSpec: needs-spec
  specAdded: spec-added
  ready: ready
  agentWorking: agent-working
  prOpened: pr-opened
  agentFailed: agent-failed
  noAgent: no-agent
  agentManual: agent-manual
automation:
  # Workflows honor GitHub Actions repo variables (default on):
  #   AGENT_AUTO_SPEC_ENABLED, AGENT_AUTO_READY_ENABLED
  # Set either variable to "false" to disable that stage.
  autoSpecOnOpen: true
  autoReadyAfterSpec: true
prompt:
  postImplementReminders: |
    Open a PR with `Fixes #{N}` in the body — leave it as a **draft**.
    UI changes REQUIRE screenshots committed under `artifacts/issue-{N}/` and linked in the issue completion comment.
    Update labels: remove `agent-working`, add `pr-opened` when the PR is open.
    You MUST post the issue completion comment before stopping. Do not stop right after opening the PR.
